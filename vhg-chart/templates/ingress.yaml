{{- if .Values.ingress.enabled }}
# BLOCK 1: API & DEV-TOOLS (Handles routing and path rewrites cleanly)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vhg-api-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api/plant(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: plant-service
                port:
                  number: 8005
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8006
          - path: /api/ai(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ai-service
                port:
                  number: 8007
          
          # ==========================================
          # INFRASTRUCTURE DEVOPS TOOLS MAPPINGS
          # ==========================================
          - path: /argocd(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
          - path: /prometheus(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus
                port:
                  number: 9090
          - path: /grafana(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
---
# BLOCK 2: FRONTEND (Handles / and static files with NO REWRITE)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vhg-frontend-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
{{- end }}