{{- if .Values.ingress.enabled }}
# BLOCK 1: API (Handles /api/* and REWRITES them)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vhg-api-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api/plant(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: plant-service
                port:
                  number: 8005
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8006
          - path: /api/ai(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ai-service
                port:
                  number: 8007
---
# BLOCK 2: FRONTEND (Handles / and static files with NO REWRITE)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vhg-frontend-ingress
  namespace: {{ .Values.namespace }}
  # IMPORTANT: No rewrite-target annotation here!
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

---
# BLOCK 3: ARGOCD (Exposes ArgoCD Dashboard on a dedicated context path)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd # Must target the namespace where ArgoCD lives
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS" # ArgoCD talks TLS natively
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /argocd
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
{{- end }}