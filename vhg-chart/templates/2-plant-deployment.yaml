apiVersion: apps/v1
kind: Deployment
metadata:
  name: plant-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: plant-service
  template:
    metadata:
      labels:
        app: plant-service
    spec:
      containers:
      - name: plant-service
        image: "{{ .Values.plant.image }}:{{ .Values.plant.tag }}"
        ports:
        - containerPort: 8005

        envFrom:
        - secretRef:
            name: vhg-secrets
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_SERVICE_VERSION
          value: "{{ .Values.plant.tag }}"
        - name: OTEL_DEPLOYMENT_ENVIRONMENT
          value: "{{ .Values.observability.environment }}"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "{{ .Values.observability.otlpEndpoint }}"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_TRACES_SAMPLER
          value: "{{ .Values.observability.tracesSampler }}"
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "{{ .Values.observability.tracesSamplerArg }}"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "{{ .Values.observability.metricExportInterval }}"
        - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
          value: "{{ .Values.observability.excludedUrls }}"
        - name: OTEL_SDK_DISABLED
          value: "{{ not .Values.observability.enabled }}"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace={{ .Values.observability.serviceNamespace }},k8s.namespace.name={{ .Values.namespace }},k8s.deployment.name=plant-service"

        livenessProbe:
          httpGet:
            path: /docs
            port: 8005
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /docs
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 5

        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "256Mi"
            cpu: "150m"
