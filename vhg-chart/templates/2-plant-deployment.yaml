apiVersion: apps/v1
kind: Deployment
metadata:
  name: plant-service
  namespace: {{ .Values.namespace }}

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: plant-service

  template:
    metadata:
      labels:
        app: plant-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.observability.prometheusPort }}"
        prometheus.io/path: "/metrics"

    spec:
      containers:
      - name: plant-service

        image: "{{ .Values.plant.image }}:{{ .Values.plant.tag }}"
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8005
        - name: prometheus-metrics
          containerPort: {{ .Values.observability.prometheusPort }}

        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false

        envFrom:
        - secretRef:
            name: vhg-secrets

        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        - name: MODULE_NAME
          value: "plant_service.main"

        - name: PORT
          value: "8005"

        - name: OTEL_SERVICE_VERSION
          value: "{{ .Values.plant.tag }}"

        - name: OTEL_DEPLOYMENT_ENVIRONMENT
          value: "{{ .Values.observability.environment }}"

        - name: OTEL_PROMETHEUS_PORT
          value: "{{ .Values.observability.prometheusPort }}"

        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "{{ .Values.observability.otlpEndpoint }}"

        - name: OTEL_TRACES_SAMPLER
          value: "{{ .Values.observability.tracesSampler }}"

        - name: OTEL_TRACES_SAMPLER_ARG
          value: "{{ .Values.observability.tracesSamplerArg }}"

        - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
          value: "{{ .Values.observability.excludedUrls }}"

        - name: OTEL_SDK_DISABLED
          value: "{{ not .Values.observability.enabled }}"

        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace={{ .Values.observability.serviceNamespace }},k8s.namespace.name={{ .Values.namespace }},k8s.deployment.name=plant-service"

        startupProbe:
          httpGet:
            path: /docs
            port: 8005
          failureThreshold: 30
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /docs
            port: 8005
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /docs
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 10

        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"

          limits:
            memory: "256Mi"
            cpu: "150m"