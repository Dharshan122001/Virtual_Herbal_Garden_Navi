apiVersion: v1
kind: Service
metadata:
  name: plant-service
  namespace: {{ .Values.namespace }}
  labels:
    app: plant-service

spec:
  selector:
    app: plant-service

  ports:
    - name: http
      port: 8005
      targetPort: 8005

    - name: metrics
      port: 9464
      targetPort: 9464

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Values.namespace }}
  labels:
    app: auth-service

spec:
  selector:
    app: auth-service

  ports:
    - name: http
      port: 8006
      targetPort: 8006

    - name: metrics
      port: 9464
      targetPort: 9464

---
apiVersion: v1
kind: Service
