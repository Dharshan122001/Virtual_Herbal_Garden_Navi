apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
        ports:
        - containerPort: 80

        env:
        - name: VITE_PLANT_API_URL
          value: "/api/plant"
        - name: VITE_AUTH_API_URL
          value: "/api/auth"
        - name: VITE_AI_API_URL
          value: "/api/ai"
        - name: VITE_DATADOG_RUM_APP_ID
          value: "{{ .Values.rum.appId }}"
        - name: VITE_DATADOG_RUM_CLIENT_TOKEN
          value: "{{ .Values.rum.clientToken }}"
        - name: VITE_DATADOG_SITE
          value: "{{ .Values.rum.site }}"
        - name: VITE_OTEL_ENV
          value: "{{ .Values.otel.env }}"

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5

        resources:
          requests:
            memory: "16Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"