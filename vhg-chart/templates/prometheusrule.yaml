apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vhg-alert-rules
  namespace: {{ .Values.namespace }}
  labels:
    release: monitoring
spec:
  groups:

  - name: vhg.availability
    rules:
    - alert: VHGServiceDown
      expr: kube_deployment_status_replicas_available{namespace="{{ .Values.namespace }}"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "{{ "{{" }} $labels.deployment {{ "}}" }} has 0 available replicas"
        description: "Deployment {{ "{{" }} $labels.deployment {{ "}}" }} in {{ .Values.namespace }} has been completely down for over 1 minute."

    - alert: VHGPodNotReady
      expr: kube_pod_status_ready{namespace="{{ .Values.namespace }}", condition="true"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is not ready"
        description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} in {{ .Values.namespace }} has been not ready for over 5 minutes."

  - name: vhg.pods
    rules:
    - alert: VHGPodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total{namespace="{{ .Values.namespace }}"}[5m]) * 300 > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is crash looping"
        description: "Container {{ "{{" }} $labels.container {{ "}}" }} in pod {{ "{{" }} $labels.pod {{ "}}" }} has restarted more than once in the last 5 minutes."

  - name: vhg.resources
    rules:
    - alert: VHGHighCPU
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace="{{ .Values.namespace }}", container!="", container!="POD"}[5m])) by (pod, container)
        / sum(kube_pod_container_resource_limits{namespace="{{ .Values.namespace }}", resource="cpu"}) by (pod, container)
        > 0.8
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage in {{ "{{" }} $labels.pod {{ "}}" }}"
        description: "Container {{ "{{" }} $labels.container {{ "}}" }} is using over 80% of its 150m CPU limit for more than 10 minutes."

    - alert: VHGHighMemory
      expr: |
        sum(container_memory_working_set_bytes{namespace="{{ .Values.namespace }}", container!="", container!="POD"}) by (pod, container)
        / sum(kube_pod_container_resource_limits{namespace="{{ .Values.namespace }}", resource="memory"}) by (pod, container)
        > 0.85
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage in {{ "{{" }} $labels.pod {{ "}}" }}"
        description: "Container {{ "{{" }} $labels.container {{ "}}" }} is using over 85% of its 256Mi memory limit for more than 10 minutes."
