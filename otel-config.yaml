receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
  resource:
    attributes:
      - key: cloud.platform
        value: "docker"
        action: insert
      - key: instrumentation.provider
        value: "opentelemetry"
        action: insert

exporters:
  datadog:
    api:
      key: "${DD_API_KEY}"
    site: "${DD_SITE:-datadoghq.com}"
    metrics:
      send_monotonic_counter: true
    resource_attributes_as_tags: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [datadog]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [datadog]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [datadog]
