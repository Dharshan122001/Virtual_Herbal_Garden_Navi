services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/controller/Dockerfile # <-- Add this exact line!
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/jenkins.yaml
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  jenkins-agent:
    build:
      context: .
      dockerfile: jenkins/agent/Dockerfile
    container_name: jenkins-agent
    restart: unless-stopped
    init: true
    environment:
      JENKINS_URL: "http://jenkins:8080"
      JENKINS_AGENT_NAME: "vhg-agent"
      JENKINS_SECRET: "394356d833561ab4357eb51fd3b8891a1c585e974ac66f04dcd8cdc39377c7dd"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - jenkins

volumes:
  jenkins_home: