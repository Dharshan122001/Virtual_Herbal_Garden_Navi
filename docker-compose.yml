services:
  plant_service:
    build:
      context: ./server
      dockerfile: plant_service/Dockerfile
    container_name: plant-service-container
    env_file:
      - ./server/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel_collector:4317
      - OTEL_SERVICE_NAME=plant-service
      - OTEL_ENV=development
      - DD_ENV=development
      - DD_SERVICE=plant-service
      - DD_TRACE_ENABLED=true
      - DATADOG_SITE=${DATADOG_SITE:-datadoghq.com}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8005:8005"
    volumes:
      - ./server:/app
    restart: always

  auth_service:
    build:
      context: ./server
      dockerfile: auth_service/Dockerfile
    container_name: auth-service-container
    env_file:
      - ./server/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel_collector:4317
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_ENV=development
      - DD_ENV=development
      - DD_SERVICE=auth-service
      - DD_TRACE_ENABLED=true
      - DATADOG_SITE=${DATADOG_SITE:-datadoghq.com}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8006:8006"
    volumes:
      - ./server:/app
    restart: always

  ai_service:
    build:
      context: ./server
      dockerfile: ai_service/Dockerfile
    container_name: ai-service-container
    env_file:
      - ./server/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel_collector:4317
      - OTEL_SERVICE_NAME=ai-service
      - OTEL_ENV=development
      - DD_ENV=development
      - DD_SERVICE=ai-service
      - DATADOG_SITE=${DATADOG_SITE:-datadoghq.com}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8007:8007"
    volumes:
      - ./server:/app
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend-container
    env_file:
      - ./client/.env
    environment:
      - VITE_DATADOG_RUM_APP_ID=${VITE_DATADOG_RUM_APP_ID}
      - VITE_DATADOG_RUM_CLIENT_TOKEN=${VITE_DATADOG_RUM_CLIENT_TOKEN}
      - VITE_DATADOG_SITE=${DATADOG_SITE:-datadoghq.com}
      - VITE_OTEL_ENV=development
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:80"
    depends_on:
      - plant_service
      - auth_service
      - ai_service
    env_file:
      - ./client/.env

  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      - DD_API_KEY=${DATADOG_API_KEY}
      - DD_SITE=${DATADOG_SITE:-datadoghq.com}
    command: ["--config", "/etc/otel-collector-config.yaml"]
    restart: unless-stopped