server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config
    location /config.js {
        add_header Cache-Control "no-store";
    }

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon fallback
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}