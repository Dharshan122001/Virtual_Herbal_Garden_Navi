server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Optional gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # Hide nginx version
    server_tokens off;

    # Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}