server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Handle the runtime config file generated by entrypoint.sh
    location = /config.js {
        add_header Content-Type application/javascript;
        try_files /config.js =404;
    }

    # 2. Fix: Explicitly handle assets without stripping the path
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 3. SPA Routing: Fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}