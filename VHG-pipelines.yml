trigger:
  branches:
    include:
      - fresh
  paths:
    include:
      - client/*
      - server/*
      - infra/*

variables:
  - group: vhg-secrets 
  - name: azureServiceConnection
    value: 'AzureConn'
  - name: dockerRegistryConn
    value: 'DockerHubConn'

stages:
# --- STAGE 1: Detect specific changes ---
- stage: Detect_and_Resolve
  displayName: "0. Detect & Resolve"
  jobs:
  - job: ResolveTags
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 0 

    - script: |
        # Identify the previous commit or fallback to current
        PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || echo "HEAD")
        CHANGED_FILES=$(git diff --name-only $PREV_COMMIT HEAD)
        echo "Files modified: $CHANGED_FILES"
        
        # Initialize flags
        CLIENT_UPDATED="false"
        SERVER_UPDATED="false"

        # Check for path-specific changes
        if echo "$CHANGED_FILES" | grep -q '^client/'; then CLIENT_UPDATED="true"; fi
        if echo "$CHANGED_FILES" | grep -q '^server/'; then SERVER_UPDATED="true"; fi

        echo "##vso[task.setvariable variable=client_changed;isOutput=true]$CLIENT_UPDATED"
        echo "##vso[task.setvariable variable=server_changed;isOutput=true]$SERVER_UPDATED"

        get_latest() {
          REPO=$1
          TAG=$(curl -s "https://hub.docker.com/v2/repositories/dharshan3690/${REPO}/tags/?page_size=100" | jq -r '.results|.[]|.name' | grep -E '^[0-9]+$' | sort -nr | head -n 1)
          if [ -z "$TAG" ] || [ "$TAG" == "null" ]; then TAG="latest"; fi
          echo "$TAG"
        }

        # Resolve Tags (New BuildId if changed, otherwise fetch existing Latest)
        if [ "$CLIENT_UPDATED" == "true" ]; then
          echo "##vso[task.setvariable variable=f_tag;isOutput=true]$(Build.BuildId)"
        else
          echo "##vso[task.setvariable variable=f_tag;isOutput=true]$(get_latest navi-frontend)"
        fi

        if [ "$SERVER_UPDATED" == "true" ]; then
          TAG="$(Build.BuildId)"
          echo "##vso[task.setvariable variable=p_tag;isOutput=true]$TAG"
          echo "##vso[task.setvariable variable=au_tag;isOutput=true]$TAG"
          echo "##vso[task.setvariable variable=ai_tag;isOutput=true]$TAG"
        else
          echo "##vso[task.setvariable variable=p_tag;isOutput=true]$(get_latest plant-service)"
          echo "##vso[task.setvariable variable=au_tag;isOutput=true]$(get_latest auth-service)"
          echo "##vso[task.setvariable variable=ai_tag;isOutput=true]$(get_latest ai-service)"
        fi
      name: TagLogic

# --- STAGE 2: Build and Push (Conditional) ---
- stage: Build_and_Push
  dependsOn: Detect_and_Resolve
  jobs:
  - job: DockerBuild
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      client_changed: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.client_changed'] ]
      server_changed: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.server_changed'] ]
    steps:
    - task: Docker@2
      displayName: "Push Frontend"
      condition: eq(variables.client_changed, 'true')
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/navi-frontend'
        command: 'buildAndPush'
        dockerfile: 'client/Dockerfile'
        tags: '$(Build.BuildId)'

    - task: Docker@2
      displayName: "Push Server Services"
      condition: eq(variables.server_changed, 'true')
      # Example for one service - duplicate for Auth/AI if needed
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/plant-service'
        command: 'buildAndPush'
        dockerfile: 'server/plant_service/Dockerfile'
        tags: '$(Build.BuildId)'

# --- STAGE 3: Deploy Infrastructure ---
- stage: Deploy_Infrastructure
  displayName: "2. Terraform Deploy"
  dependsOn: [Detect_and_Resolve, Build_and_Push]
  condition: succeeded('Detect_and_Resolve')
  jobs:
  - job: TerraformApply
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      final_f_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.f_tag'] ]
      final_p_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.p_tag'] ]
      final_au_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.au_tag'] ]
      final_ai_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_tag'] ]
    steps:
    - script: |
        echo "Resolved Frontend Tag: $(final_f_tag)"
        echo "##vso[task.setvariable variable=agent_ip]$(curl -s ifconfig.me)"
      displayName: "Verify Tags & Fetch IP"

    - task: TerraformTaskV4@4
      displayName: "Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: 'infra'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: >
          -var="db_password=$(DB_PASSWORD)" 
          -var="frontend_tag=$(final_f_tag)" 
          -var="plant_tag=$(final_p_tag)" 
          -var="auth_tag=$(final_au_tag)" 
          -var="ai_tag=$(final_ai_tag)"
          -var="my_ip=$(agent_ip)"