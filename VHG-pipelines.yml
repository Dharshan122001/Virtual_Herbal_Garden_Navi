trigger:
  branches:
    include: [ fresh ]
  paths:
    include: [ client/*, server/*, infra/* ]

variables:
  - group: vhg-secrets 
  - name: dockerRegistryConn
    value: 'DockerHubConn'

stages:
- stage: Detect_and_Resolve
  displayName: "0. Smart Detection"
  jobs:
  - job: ResolveTags
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 0 

    - script: |
        PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || echo "HEAD")
        CHANGED_FILES=$(git diff --name-only $PREV_COMMIT HEAD)
        
        # Function to fetch latest tag from Docker Hub
        get_latest() {
          REPO=$1
          TAG=$(curl -s "https://hub.docker.com/v2/repositories/dharshan3690/${REPO}/tags/?page_size=100" | jq -r '.results|.[]|.name' | grep -E '^[0-9]+$' | sort -nr | head -n 1)
          [ -z "$TAG" ] || [ "$TAG" == "null" ] && TAG="latest"
          echo "$TAG"
        }

        # --- Microservice Detection Logic ---
        services=("navi-frontend:client" "plant-service:server/plant_service" "auth-service:server/auth_service" "ai-service:server/ai_service")

        for service in "${services[@]}"; do
          REPO="${service%%:*}"
          PATH_DIR="${service#*:}"
          VAR_NAME=$(echo $REPO | tr '-' '_')
          
          # Check if the specific service path OR 'server/common' (shared code) changed
          if echo "$CHANGED_FILES" | grep -qE "^($PATH_DIR/|server/common/)"; then
            echo "Changes detected in $REPO. Building new image."
            echo "##vso[task.setvariable variable=${VAR_NAME}_changed;isOutput=true]true"
            echo "##vso[task.setvariable variable=${VAR_NAME}_tag;isOutput=true]$(Build.BuildId)"
          else
            echo "No changes in $REPO. Using latest existing tag."
            echo "##vso[task.setvariable variable=${VAR_NAME}_changed;isOutput=true]false"
            echo "##vso[task.setvariable variable=${VAR_NAME}_tag;isOutput=true]$(get_latest $REPO)"
          fi
        done
      name: TagLogic

- stage: Build_and_Push
  dependsOn: Detect_and_Resolve
  jobs:
  - job: DockerBuild
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      f_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.navi_frontend_changed'] ]
      p_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.plant_service_changed'] ]
      au_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.auth_service_changed'] ]
      ai_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_service_changed'] ]
    steps:
    - task: Docker@2
      displayName: "Build Frontend"
      condition: eq(variables.f_upd, 'true')
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/navi-frontend'
        command: 'buildAndPush'
        dockerfile: 'client/Dockerfile'
        tags: '$(Build.BuildId)'

    - task: Docker@2
      displayName: "Build Plant Service"
      condition: eq(variables.p_upd, 'true')
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/plant-service'
        command: 'buildAndPush'
        dockerfile: 'server/plant_service/Dockerfile'
        tags: '$(Build.BuildId)'

    # ... Repeat for Auth and AI with their respective conditions (au_upd and ai_upd) ...

- stage: Deploy_Infrastructure
  dependsOn: [Detect_and_Resolve, Build_and_Push]
  jobs:
  - job: TerraformApply
    variables:
      f_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.navi_frontend_tag'] ]
      p_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.plant_service_tag'] ]
      au_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.auth_service_tag'] ]
      ai_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_service_tag'] ]
    steps:
    - task: TerraformTaskV4@4
      inputs:
        command: 'apply'
        commandOptions: >
          -var="frontend_tag=$(f_tag)" 
          -var="plant_tag=$(p_tag)" 
          -var="auth_tag=$(au_tag)" 
          -var="ai_tag=$(ai_tag)"
          -var="db_password=$(DB_PASSWORD)"
          -var="my_ip=$(agent_ip)"