trigger:
  branches:
    include:
      - fresh # whenever the fresh branch is triggered then this pipeline is going to be used

variables:
  - group: vhg-secrets # for now only the DB password has been used
  - name: azureServiceConnection # connection to the Azure is done for terraform
    value: 'AzureConn'
  - name: dockerRegistryConn # connection to the Dockerhub to push and pull
    value: 'DockerHubConn'

stages:
# --- STAGE 1: Used to check if there is any changes in the client / server
- stage: Detect_and_Resolve
  displayName: "0. Detect & Resolve"
  jobs:
  - job: ResolveTags
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 0 

    - script: |
        # 1. Diff against previous commit
        # -- STAGE 3: Deploy Infrastructure ---

        PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || echo "HEAD")
        # getting only the changed files from present and previous commit
        CHANGED_FILES=$(git diff --name-only HEAD $PREV_COMMIT) 
        echo "Files modified: $CHANGED_FILES"
        
        get_latest() {
          REPO=$1
          TAG=$(curl -s "https://hub.docker.com/v2/repositories/dharshan3690/${REPO}/tags/?page_size=100" | jq -r '.results|.[]|.name' | grep -E '^[0-9]+$' | sort -nr | head -n 1)
          if [ -z "$TAG" ] || [ "$TAG" == "null" ]; then TAG="latest"; fi
          echo "$TAG"
        }

        if echo "$CHANGED_FILES" | grep -E '^(client/|server/)'; then
          echo "##vso[task.setvariable variable=app_changed;isOutput=true]true"
          TAG="$(Build.BuildId)"
          echo "##vso[task.setvariable variable=f_tag;isOutput=true]$TAG"
          echo "##vso[task.setvariable variable=p_tag;isOutput=true]$TAG"
          echo "##vso[task.setvariable variable=au_tag;isOutput=true]$TAG"
          echo "##vso[task.setvariable variable=ai_tag;isOutput=true]$TAG"
        else
          echo "##vso[task.setvariable variable=app_changed;isOutput=true]false"
          echo "##vso[task.setvariable variable=f_tag;isOutput=true]$(get_latest navi-frontend)"
          echo "##vso[task.setvariable variable=p_tag;isOutput=true]$(get_latest plant-service)"
          echo "##vso[task.setvariable variable=au_tag;isOutput=true]$(get_latest auth-service)"
          echo "##vso[task.setvariable variable=ai_tag;isOutput=true]$(get_latest ai-service)"
        fi
      name: TagLogic

# --- STAGE 2: Build and Push (Only if code changed) ---
- stage: Build_and_Push
  dependsOn: Detect_and_Resolve
  condition: eq(dependencies.Detect_and_Resolve.outputs['ResolveTags.TagLogic.app_changed'], 'true')
  jobs:
  - job: DockerBuild
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: "Push Frontend"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/navi-frontend'
        command: 'buildAndPush'
        dockerfile: 'client/Dockerfile'
        tags: '$(Build.BuildId)'

    - task: Docker@2
      displayName: "Push Plant Service"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/plant-service'
        command: 'buildAndPush'
        dockerfile: 'server/plant_service/Dockerfile'
        tags: '$(Build.BuildId)'

    - task: Docker@2
      displayName: "Push Auth Service"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/auth-service'
        command: 'buildAndPush'
        dockerfile: 'server/auth_service/Dockerfile'
        tags: '$(Build.BuildId)'

    - task: Docker@2
      displayName: "Push AI Service"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/ai-service'
        command: 'buildAndPush'
        dockerfile: 'server/ai_service/Dockerfile'
        tags: '$(Build.BuildId)'

# --- STAGE 3: Deploy Infrastructure ---
- stage: Deploy_Infrastructure
  displayName: "2. Terraform Deploy"
  dependsOn: [Detect_and_Resolve, Build_and_Push] # needs to run after stage 1 and 2
  condition: succeeded('Detect_and_Resolve')
  jobs:
  - job: TerraformApply
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      # THE CRITICAL FIX: Cross-stage variable mapping syntax
      final_f_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.f_tag'] ]
      final_p_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.p_tag'] ]
      final_au_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.au_tag'] ]
      final_ai_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_tag'] ]
    steps:
    - script: |
        echo "Resolved Frontend Tag: $(final_f_tag)"
        echo "##vso[task.setvariable variable=agent_ip]$(curl -s ifconfig.me)"
      displayName: "Verify Tags & Fetch IP"

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: "Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: 'infra'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: 'Darshan.k_lean_rg'
        backendAzureRmStorageAccountName: 'vhgstate123'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: "Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: 'infra'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: >
          -var="db_password=$(DB_PASSWORD)" 
          -var="frontend_tag=$(final_f_tag)" 
          -var="plant_tag=$(final_p_tag)" 
          -var="auth_tag=$(final_au_tag)" 
          -var="ai_tag=$(final_ai_tag)"
          -var="my_ip=$(agent_ip)"