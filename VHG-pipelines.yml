trigger:
  branches:
    include:
      - fresh

variables:
  - group: vhg-secrets 
  - name: azureServiceConnection
    value: 'AzureConn'
  - name: dockerRegistryConn
    value: 'DockerHubConn'
  - name: tag
    value: '$(Build.BuildId)'

stages:
# --- STAGE 1: Detect Changes ---
- stage: Detect_Changes
  displayName: "0. Check Modified Paths"
  jobs:
  - job: CheckChanges
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - script: |
        CHANGED_FILES=$(git diff --name-only HEAD HEAD~1)
        echo "Files changed: $CHANGED_FILES"
        if echo "$CHANGED_FILES" | grep -E '^(client/|server/)'; then
          echo "##vso[task.setvariable variable=app_changed;isOutput=true]true"
        else
          echo "##vso[task.setvariable variable=app_changed;isOutput=true]false"
        fi
      name: DetermineChanges
      displayName: "Run Git Diff"

# --- STAGE 2: Build and Push Docker Images ---
- stage: Build_and_Push
  displayName: "1. Build & Push Images"
  dependsOn: Detect_Changes
  condition: eq(dependencies.Detect_Changes.outputs['CheckChanges.DetermineChanges.app_changed'], 'true')
  jobs:
  - job: DockerBuild
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: "Push Frontend"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/navi-frontend'
        command: 'buildAndPush'
        dockerfile: 'client/Dockerfile'
        buildContext: 'client/'
        tags: '$(tag)'
    - task: Docker@2
      displayName: "Push Plant Service"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/plant-service'
        command: 'buildAndPush'
        dockerfile: 'server/plant_service/Dockerfile'
        buildContext: 'server/'
        tags: '$(tag)'
    - task: Docker@2
      displayName: "Push Auth Service"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/auth-service'
        command: 'buildAndPush'
        dockerfile: 'server/auth_service/Dockerfile'
        buildContext: 'server/'
        tags: '$(tag)'
    - task: Docker@2
      displayName: "Push AI Service"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/ai-service'
        command: 'buildAndPush'
        dockerfile: 'server/ai_service/Dockerfile'
        buildContext: 'server/'
        tags: '$(tag)'

# --- STAGE 3: Deploy Infrastructure via Terraform ---
- stage: Deploy_Infrastructure
  displayName: "2. Terraform Deploy"
  dependsOn: 
    - Detect_Changes
    - Build_and_Push
  condition: succeeded('Detect_Changes')
  jobs:
  - job: TerraformApply
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # --- NEW STEP: Fetch Agent IP ---
    - script: |
        IP=$(curl -s ifconfig.me)
        echo "##vso[task.setvariable variable=computed_ip]$IP"
      displayName: "Fetch Pipeline Agent IP"

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: 'Darshan.k_lean_rg'
        backendAzureRmStorageAccountName: 'vhgstate123' 
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: >
          -var="db_password=$(DB_PASSWORD)" 
          -var="frontend_tag=$(tag)" 
          -var="plant_tag=$(tag)" 
          -var="auth_tag=$(tag)" 
          -var="ai_tag=$(tag)"
          -var="my_ip=$(computed_ip)"


# this is general
      