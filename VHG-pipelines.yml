trigger:
  branches:
    include:
      - fresh

variables:
  # 1. Links to the Variable Group in ADO Library
  - group: vhg-secrets 
  
  # 2. Service Connection and Tagging Variables
  - name: azureServiceConnection
    value: 'AzureConn'
  - name: dockerRegistryConn
    value: 'DockerHubConn'
  - name: tag
    value: '$(Build.BuildId)'

stages:
# --- STAGE 1: Build and Push Docker Images ---
- stage: Build_and_Push
  displayName: "1. Build & Push Images"
  jobs:
  - job: DockerBuild
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # 1. Frontend
    - task: Docker@2
      displayName: "Push Frontend"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/navi-frontend'
        command: 'buildAndPush'
        dockerfile: 'client/Dockerfile'
        buildContext: 'client/'
        tags: '$(tag)'

    # 2. Plant Service
    - task: Docker@2
      displayName: "Push Plant Service"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/plant-service'
        command: 'buildAndPush'
        dockerfile: 'server/plant_service/Dockerfile'
        buildContext: 'server/'
        tags: '$(tag)'

    # 3. Auth Service
    - task: Docker@2
      displayName: "Push Auth Service"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/auth-service'
        command: 'buildAndPush'
        dockerfile: 'server/auth_service/Dockerfile'
        buildContext: 'server/'
        tags: '$(tag)'

    # 4. AI Service
    - task: Docker@2
      displayName: "Push AI Service"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/ai-service'
        command: 'buildAndPush'
        dockerfile: 'server/ai_service/Dockerfile'
        buildContext: 'server/'
        tags: '$(tag)'

# --- STAGE 2: Deploy Infrastructure via Terraform ---
- stage: Deploy_Infrastructure
  displayName: "2. Terraform Deploy"
  dependsOn: Build_and_Push
  condition: succeeded()
  jobs:
  - job: TerraformApply
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # Install Terraform CLI
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    # Initialize Terraform (Connects to your Azure Storage for State)
    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: 'Darshan.k_lean_rg'
        backendAzureRmStorageAccountName: 'vhgstate123' 
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    # Apply Changes (Updates App Services with the new $(tag))
    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: >
          -var="db_password=$(DB_PASSWORD)" 
          -var="frontend_tag=$(tag)" 
          -var="plant_tag=$(tag)" 
          -var="auth_tag=$(tag)" 
          -var="ai_tag=$(tag)"