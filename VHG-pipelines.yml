trigger:
  branches:
    include:
      - fresh
  paths:
    include:
      - client/*
      - server/*
      - vhg-chart/*

variables:
  - group: vhg-secrets
  - name: dockerRegistryConn
    value: 'DockerHubConn' 
  - name: dockerUser
    value: 'dharshan3690'

stages:
# 0. Identify what changed
- stage: Detect_and_Resolve
  displayName: "0. Smart Detect"
  jobs:
  - job: ResolveTags
    pool: { vmImage: 'ubuntu-latest' }
    steps:
    - checkout: self
      fetchDepth: 0 
    - script: |
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
        f=false; p=false; au=false; ai=false;
        if [ "$CHANGED_FILES" == "ALL" ]; then
           f=true; p=true; au=true; ai=true;
        else
           for file in $CHANGED_FILES; do
             case "$file" in
               client/*) f=true ;;
               server/plant_service/*|server/common/*|server/requirements.txt) p=true ;;
               server/auth_service/*|server/common/*|server/requirements.txt) au=true ;;
               server/ai_service/*|server/common/*|server/requirements.txt) ai=true ;;
             esac
           done
        fi
        echo "##vso[task.setvariable variable=f_changed;isOutput=true]$f"
        echo "##vso[task.setvariable variable=p_changed;isOutput=true]$p"
        echo "##vso[task.setvariable variable=au_changed;isOutput=true]$au"
        echo "##vso[task.setvariable variable=ai_changed;isOutput=true]$ai"
      name: TagLogic

# 1. Build only modified services
- stage: Build_and_Push
  displayName: "1. Build and Push"
  dependsOn: Detect_and_Resolve
  jobs:
  - job: DockerBuild
    pool: { vmImage: 'ubuntu-latest' }
    variables:
      p_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.p_changed'] ]
      au_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.au_changed'] ]
      ai_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_changed'] ]
      f_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.f_changed'] ]
    steps:
    - task: Docker@2
      displayName: "Login"
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        command: 'login'

    - script: |
        set -e
        # Build Plant Service
        if [ "$(p_upd)" == "true" ]; then
          cp server/requirements.txt server/plant_service/
          cp -r server/common server/plant_service/common
          cd server/plant_service && docker build -t $(dockerUser)/plant-service:$(Build.BuildId) .
          docker push $(dockerUser)/plant-service:$(Build.BuildId)
          cd ../..
        fi
        # Build Auth Service
        if [ "$(au_upd)" == "true" ]; then
          cp server/requirements.txt server/auth_service/
          cp -r server/common server/auth_service/common
          cd server/auth_service && docker build -t $(dockerUser)/auth-service:$(Build.BuildId) .
          docker push $(dockerUser)/auth-service:$(Build.BuildId)
          cd ../..
        fi
        # Build AI Service
        if [ "$(ai_upd)" == "true" ]; then
          cp server/requirements.txt server/ai_service/
          cp -r server/common server/ai_service/common
          cd server/ai_service && docker build -t $(dockerUser)/ai-service:$(Build.BuildId) .
          docker push $(dockerUser)/ai-service:$(Build.BuildId)
          cd ../..
        fi
      displayName: "Inject and Build Backend"

    - script: |
        set -e
        if [ "$(f_upd)" == "true" ]; then
          cd client && npm install && npm run build
          docker build -t $(dockerUser)/navi-frontend:$(Build.BuildId) .
          docker push $(dockerUser)/navi-frontend:$(Build.BuildId)
        fi
      displayName: "Build Frontend"

# 2. Update Helm Chart
- stage: GitOps_Update
  displayName: "2. GitOps Sync"
  dependsOn: [Detect_and_Resolve, Build_and_Push]
  jobs:
  - job: UpdateManifest
    pool: { vmImage: 'ubuntu-latest' }
    variables:
      f_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.f_changed'] ]
      p_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.p_changed'] ]
      au_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.au_changed'] ]
      ai_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_changed'] ]
    steps:
    - checkout: self
      persistCredentials: true 
    - script: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
        [ "$(f_upd)" == "true" ] && yq -i ".frontend.tag = \"$(Build.BuildId)\"" vhg-chart/values.yaml
        [ "$(p_upd)" == "true" ] && yq -i ".plant.tag = \"$(Build.BuildId)\"" vhg-chart/values.yaml
        [ "$(au_upd)" == "true" ] && yq -i ".auth.tag = \"$(Build.BuildId)\"" vhg-chart/values.yaml
        [ "$(ai_upd)" == "true" ] && yq -i ".ai.tag = \"$(Build.BuildId)\"" vhg-chart/values.yaml
        
        git config --global user.email "devops@navikenz.com"
        git config --global user.name "PipelineBot"
        if ! git diff --exit-code vhg-chart/values.yaml; then
          git add vhg-chart/values.yaml
          git commit -m "GitOps: deploy $(Build.BuildId) [skip ci]"
          # THE FIX: Explicitly push current HEAD to the 'fresh' branch
          git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" push origin HEAD:fresh
        fi
      displayName: "Sync Manifest"