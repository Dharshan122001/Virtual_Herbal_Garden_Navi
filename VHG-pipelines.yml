trigger:
  branches:
    include:
      - extend

  paths:
    include:
      - client/**
      - server/**
      - vhg-chart/**

variables:
  - group: vhg-secrets

  - name: dockerRegistryConn
    value: 'DockerHubConn'

  - name: dockerUser
    value: 'dharshan3690'

stages:

# =========================================================
# STAGE 0 - DETECT CHANGES
# =========================================================
- stage: Detect_and_Resolve
  displayName: "0. Smart Detect"

  jobs:
    - job: ResolveTags

      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: self
          fetchDepth: 0

        - script: |
            echo "Detecting changed files..."

            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")

            echo "$CHANGED_FILES"

            f=false
            p=false
            au=false
            ai=false

            if [ "$CHANGED_FILES" = "ALL" ]; then
              f=true
              p=true
              au=true
              ai=true

            else

              for file in $CHANGED_FILES; do

                case "$file" in

                  client/*)
                    f=true
                    ;;

                  server/plant_service/*|server/plantmain.py|server/common/*|server/requirements.txt)
                    p=true
                    ;;

                  server/auth_service/*|server/authmain.py|server/common/*|server/requirements.txt)
                    au=true
                    ;;

                  server/ai_service/*|server/aimain.py|server/common/*|server/requirements.txt)
                    ai=true
                    ;;

                esac

              done

            fi

            echo "Frontend Changed: $f"
            echo "Plant Changed: $p"
            echo "Auth Changed: $au"
            echo "AI Changed: $ai"

            echo "##vso[task.setvariable variable=f_changed;isOutput=true]$f"
            echo "##vso[task.setvariable variable=p_changed;isOutput=true]$p"
            echo "##vso[task.setvariable variable=au_changed;isOutput=true]$au"
            echo "##vso[task.setvariable variable=ai_changed;isOutput=true]$ai"

          name: TagLogic
          displayName: "Detect Modified Services"

# =========================================================
# STAGE 1 - BUILD & PUSH IMAGES
# =========================================================
- stage: Build_and_Push
  displayName: "1. Build and Push"

  dependsOn: Detect_and_Resolve

  jobs:
    - job: DockerBuild

      pool:
        vmImage: 'ubuntu-latest'

      variables:
        p_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.p_changed'] ]
        au_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.au_changed'] ]
        ai_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_changed'] ]
        f_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.f_changed'] ]

      steps:

        - task: Docker@2
          displayName: "DockerHub Login"

          inputs:
            containerRegistry: '$(dockerRegistryConn)'
            command: 'login'

        - script: |

            set -e

            build_backend_service() {

              SERVICE_DIR=$1
              IMAGE_NAME=$2

              echo "=================================="
              echo "Building ${IMAGE_NAME}"
              echo "=================================="

              WORKSPACE="server/build_${SERVICE_DIR}"

              rm -rf ${WORKSPACE}

              mkdir -p ${WORKSPACE}

              cp server/requirements.txt ${WORKSPACE}/
              cp server/Dockerfile ${WORKSPACE}/

              cp -r server/common ${WORKSPACE}/common

              mkdir -p ${WORKSPACE}/${SERVICE_DIR}

              cp -r server/${SERVICE_DIR}/* ${WORKSPACE}/${SERVICE_DIR}/

              cd ${WORKSPACE}

              docker build \
                --no-cache \
                -t $(dockerUser)/${IMAGE_NAME}:$(Build.BuildId) .

              docker push $(dockerUser)/${IMAGE_NAME}:$(Build.BuildId)

              cd ../..

              rm -rf ${WORKSPACE}

            }

            # =============================
            # BUILD PLANT SERVICE
            # =============================

            if [ "$(p_upd)" = "true" ]; then

              build_backend_service \
                "plant_service" \
                "plant-service"

            fi

            # =============================
            # BUILD AUTH SERVICE
            # =============================

            if [ "$(au_upd)" = "true" ]; then

              build_backend_service \
                "auth_service" \
                "auth-service"

            fi

            # =============================
            # BUILD AI SERVICE
            # =============================

            if [ "$(ai_upd)" = "true" ]; then

              build_backend_service \
                "ai_service" \
                "ai-service"

            fi

          displayName: "Build Backend Services"

        - script: |

            set -e

            if [ "$(f_upd)" = "true" ]; then

              echo "Building Frontend..."

              cd client

              docker build \
                --no-cache \
                -t $(dockerUser)/frontend:$(Build.BuildId) .

              docker push $(dockerUser)/frontend:$(Build.BuildId)

            fi

          displayName: "Build Frontend"

# =========================================================
# STAGE 2 - GITOPS UPDATE
# =========================================================
- stage: GitOps_Update
  displayName: "2. GitOps Sync"

  dependsOn:
    - Detect_and_Resolve
    - Build_and_Push

  condition: succeeded()

  jobs:
    - job: UpdateManifest

      pool:
        vmImage: 'ubuntu-latest'

      variables:
        f_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.f_changed'] ]
        p_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.p_changed'] ]
        au_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.au_changed'] ]
        ai_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_changed'] ]

      steps:

        - checkout: self
          persistCredentials: true

        - script: |

            sudo wget \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
              -O /usr/bin/yq

            sudo chmod +x /usr/bin/yq

            # =====================================
            # UPDATE IMAGE TAGS
            # =====================================

            if [ "$(f_upd)" = "true" ]; then
              yq -i '.frontend.tag = "$(Build.BuildId)"' vhg-chart/values.yaml
            fi

            if [ "$(p_upd)" = "true" ]; then
              yq -i '.plant.tag = "$(Build.BuildId)"' vhg-chart/values.yaml
            fi

            if [ "$(au_upd)" = "true" ]; then
              yq -i '.auth.tag = "$(Build.BuildId)"' vhg-chart/values.yaml
            fi

            if [ "$(ai_upd)" = "true" ]; then
              yq -i '.ai.tag = "$(Build.BuildId)"' vhg-chart/values.yaml
            fi

            echo "Updated values.yaml"

            cat vhg-chart/values.yaml

            # =====================================
            # GIT COMMIT
            # =====================================

            git config --global user.email "pipeline@navikenz.com"
            git config --global user.name "GitOps Bot"

            if ! git diff --quiet vhg-chart/values.yaml; then

              git add vhg-chart/values.yaml

              git commit -m "GitOps: deploy build $(Build.BuildId) [skip ci]"

              git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" \
                push origin HEAD:extend

            else

              echo "No manifest changes detected."

            fi

          displayName: "Update Helm Tags"