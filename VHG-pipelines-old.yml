trigger:
  branches:
    include:
      - fresh
  paths:
    include:
      - client/*
      - server/*
      - infra/*

variables:
  - group: vhg-secrets 
  - name: azureServiceConnection
    value: 'AzureConn'
  - name: dockerRegistryConn
    value: 'DockerHubConn'

stages:
# --- STAGE 1: Smart Detect & Tag Resolution ---
- stage: Detect_and_Resolve
  displayName: "0. Smart Detect"
  jobs:
  - job: ResolveTags
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 0 

    - script: |
        PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || echo "HEAD")
        CHANGED_FILES=$(git diff --name-only $PREV_COMMIT HEAD)
        echo "Files modified: $CHANGED_FILES"
        
        get_latest() {
          REPO=$1
          TAG=$(curl -s "https://hub.docker.com/v2/repositories/dharshan3690/${REPO}/tags/?page_size=100" | jq -r '.results|.[]|.name' | grep -E '^[0-9]+$' | sort -nr | head -n 1)
          if [ -z "$TAG" ] || [ "$TAG" == "null" ]; then TAG="latest"; fi
          echo "$TAG"
        }

        # 1. Frontend Detection
        if echo "$CHANGED_FILES" | grep -q '^client/'; then
          echo "##vso[task.setvariable variable=f_changed;isOutput=true]true"
          echo "##vso[task.setvariable variable=f_tag;isOutput=true]$(Build.BuildId)"
        else
          echo "##vso[task.setvariable variable=f_changed;isOutput=true]false"
          echo "##vso[task.setvariable variable=f_tag;isOutput=true]$(get_latest navi-frontend)"
        fi

        # 2. Microservices Detection (Plant, Auth, AI)
        # Rebuilds if specific folder OR 'server/common' changes
        services=("plant-service:server/plant_service:p" "auth-service:server/auth_service:au" "ai-service:server/ai_service:ai")

        for s in "${services[@]}"; do
          REPO="${s%%:*}"; REM="${s#*:}"; DIR="${REM%%:*}"; SFX="${REM#*:}"
          
          if echo "$CHANGED_FILES" | grep -qE "^($DIR/|server/common/)"; then
            echo "Changes detected in $REPO. Tagging with $(Build.BuildId)"
            echo "##vso[task.setvariable variable=${SFX}_changed;isOutput=true]true"
            echo "##vso[task.setvariable variable=${SFX}_tag;isOutput=true]$(Build.BuildId)"
          else
            echo "No changes in $REPO. Using latest existing tag."
            echo "##vso[task.setvariable variable=${SFX}_changed;isOutput=true]false"
            echo "##vso[task.setvariable variable=${SFX}_tag;isOutput=true]$(get_latest $REPO)"
          fi
        done
      name: TagLogic

# --- STAGE 2: Build and Push (Conditional) ---
- stage: Build_and_Push
  displayName: "1. Build and Push"
  dependsOn: Detect_and_Resolve
  jobs:
  - job: DockerBuild
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      f_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.f_changed'] ]
      p_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.p_changed'] ]
      au_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.au_changed'] ]
      ai_upd: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_changed'] ]
    steps:
    - task: Docker@2
      displayName: "Push Frontend"
      condition: eq(variables.f_upd, 'true')
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/navi-frontend'
        command: 'buildAndPush'
        dockerfile: 'client/Dockerfile'
        tags: '$(Build.BuildId)'

    - task: Docker@2
      displayName: "Push Plant Service"
      condition: eq(variables.p_upd, 'true')
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/plant-service'
        command: 'buildAndPush'
        dockerfile: 'server/plant_service/Dockerfile'
        tags: '$(Build.BuildId)'

    - task: Docker@2
      displayName: "Push Auth Service"
      condition: eq(variables.au_upd, 'true')
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/auth-service'
        command: 'buildAndPush'
        dockerfile: 'server/auth_service/Dockerfile'
        tags: '$(Build.BuildId)'

    - task: Docker@2
      displayName: "Push AI Service"
      condition: eq(variables.ai_upd, 'true')
      inputs:
        containerRegistry: '$(dockerRegistryConn)'
        repository: 'dharshan3690/ai-service'
        command: 'buildAndPush'
        dockerfile: 'server/ai_service/Dockerfile'
        tags: '$(Build.BuildId)'

# --- STAGE 3: Deploy Infrastructure ---
- stage: Deploy_Infrastructure
  displayName: "2. Terraform Deploy"
  dependsOn: [Detect_and_Resolve, Build_and_Push]
  condition: succeeded('Detect_and_Resolve')
  jobs:
  - job: TerraformApply
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      final_f_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.f_tag'] ]
      final_p_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.p_tag'] ]
      final_au_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.au_tag'] ]
      final_ai_tag: $[ stageDependencies.Detect_and_Resolve.ResolveTags.outputs['TagLogic.ai_tag'] ]
    steps:
    - checkout: self

    - script: |
        echo "##vso[task.setvariable variable=agent_ip]$(curl -s ifconfig.me)"
      displayName: "Fetch Agent IP"

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: "Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: 'infra'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: 'Darshan.k_lean_rg'
        backendAzureRmStorageAccountName: 'vhgstate123'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: "Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: 'infra'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: >
          -var="db_password=$(DB_PASSWORD)" 
          -var="frontend_tag=$(final_f_tag)" 
          -var="plant_tag=$(final_p_tag)" 
          -var="auth_tag=$(final_au_tag)" 
          -var="ai_tag=$(final_ai_tag)"
          -var="my_ip=$(agent_ip)"